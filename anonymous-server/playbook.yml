---
- hosts: anonimo
  become: yes

  tasks:

    - name: Install vsftpd and FTP client
      apt:
        name:
          - vsftpd      # FTP server package
          - ftp         # FTP client for testing
        state: present
        update_cache: yes

    - name: Create FTP directory
      file:
        path: /srv/ftp
        state: directory
        owner: root
        group: ftp
        mode: '0755'

    - name: Create welcome INFO file
      copy:
        dest: /srv/ftp/INFO
        content: |
          --
          -- Anonymous FTP Server
          -- Maximum 200 simultaneous connections
          -- Bandwidth limited to 50KB/s
          -- Inactivity timeout: 30 seconds
          --

    - name: Configure vsftpd
      copy:
        dest: /etc/vsftpd.conf
        content: |
          listen=YES
          listen_ipv6=NO
          anonymous_enable=YES
          no_anon_password=YES
          local_enable=NO
          write_enable=NO
          banner_file=/srv/ftp/INFO
          ftpd_banner=-- Anonymous FTP Mirror for 'sistema.sol' --
          anon_root=/srv/ftp
          max_clients=200
          anon_max_rate=50000
          idle_session_timeout=30
        owner: root
        group: root
        mode: '0644'

    - name: Restart vsftpd service
      systemd:
        name: vsftpd
        state: restarted
        enabled: yes

